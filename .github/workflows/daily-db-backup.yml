name: Daily backup mirror

# Mirrors the latest production backup from S3 into a GitHub Actions
# artifact, so the dump is available even if AWS access is later lost.
#
# Architecture: the actual pg_dump runs on the EC2 box (which sits in the
# same VPC as RDS) via a root cron at 02:00 UTC — see
# scripts/cron/run-ec2-backup.sh and scripts/install-ec2-backup-cron.sh.
# That writes:
#   s3://<S3_BACKUP_BUCKET>/db-backups/YYYYMMDD_HHMMSS/makuta_portal_*.sql.gz
#   s3://<S3_BACKUP_BUCKET>/file-backups/YYYY-MM-DD/...
#
# This workflow runs ~3 hours later, picks the freshest dump, and stores
# it as a GHA artifact (90-day retention). That gives the off-AWS copy.
#
# Required repo secrets (set already by the backup-pipeline IAM user):
#   AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY  — read on backup bucket
#   AWS_REGION                                  — us-east-1
#   S3_BACKUP_BUCKET                            — makuta-backup-use1

on:
  schedule:
    # 05:00 UTC = ~3h after the EC2 cron at 02:00 UTC
    - cron: '0 5 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mirror:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Find latest dump in S3
        id: find
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DST: ${{ secrets.S3_BACKUP_BUCKET }}
        run: |
          set -euo pipefail
          if [ -z "${AWS_ACCESS_KEY_ID:-}" ] || [ -z "${DST:-}" ]; then
            echo "::error::Missing AWS_ACCESS_KEY_ID or S3_BACKUP_BUCKET secret."
            exit 1
          fi
          LATEST=$(aws s3api list-objects-v2 \
            --bucket "$DST" \
            --prefix db-backups/ \
            --query 'reverse(sort_by(Contents[?ends_with(Key, `.sql.gz`)], &LastModified))[0].Key' \
            --output text)
          if [ -z "$LATEST" ] || [ "$LATEST" = "None" ]; then
            echo "::error::No .sql.gz dumps found under s3://$DST/db-backups/"
            echo "Has the EC2 cron run yet? Check on the box:  ls /var/log/makuta/"
            exit 1
          fi
          OUT=$(basename "$LATEST")
          echo "key=$LATEST" >> "$GITHUB_OUTPUT"
          echo "file=$OUT"   >> "$GITHUB_OUTPUT"
          echo "Latest dump: $LATEST"

      - name: Download dump
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          DST: ${{ secrets.S3_BACKUP_BUCKET }}
          KEY: ${{ steps.find.outputs.key }}
          FILE: ${{ steps.find.outputs.file }}
        run: |
          set -euo pipefail
          aws s3 cp "s3://$DST/$KEY" "$FILE"
          ls -lh "$FILE"
          gzip -t "$FILE"
          echo "Decompressed size:"
          gzip -l "$FILE" | tail -n 1

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: db-backup-${{ github.run_number }}
          path: ${{ steps.find.outputs.file }}
          retention-days: 90
          if-no-files-found: error
