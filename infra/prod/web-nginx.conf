# Internal nginx config for the makuta-portal-web container.
# Serves the Vite-built SPA. Public TLS termination + /api proxying happens
# upstream in the CRM's makuta_nginx_prod container.

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Long-cache fingerprinted Vite assets (filenames include a content hash).
    location ~* \.(?:css|js|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|webp|ico|map)$ {
        expires 30d;
        access_log off;
        add_header Cache-Control "public, immutable";
    }

    # SPA history fallback — every non-asset path serves index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The HTML shell must never be cached so users pick up new asset hashes.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
