# Nginx vhost for the Makuta Portal — drop into the CRM nginx container's
# conf.d so the existing public reverse proxy serves invoice.makutadevelopers.com
# alongside crm.makutadevelopers.com.
#
# Install:  sudo cp invoice.makutadevelopers.com.conf /opt/makuta/crm/nginx/conf.d/
# Reload:   sudo docker exec makuta_nginx_prod nginx -s reload
#
# Cert is issued by certbot (host-side) into /etc/letsencrypt/live/invoice.makutadevelopers.com/
# which the CRM nginx container already mounts read-only.

# ── HTTP: ACME challenge + redirect to HTTPS ────────────────────────────────
server {
    listen 80;
    server_name invoice.makutadevelopers.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS: portal app ───────────────────────────────────────────────────────
server {
    listen 443 ssl;
    http2 on;
    server_name invoice.makutadevelopers.com;

    # Re-resolve upstream container names on Docker's embedded DNS so deploys
    # that recreate containers don't leave the proxy pinned to a stale IP.
    resolver 127.0.0.11 valid=10s ipv6=off;

    ssl_certificate /etc/letsencrypt/live/invoice.makutadevelopers.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/invoice.makutadevelopers.com/privkey.pem;

    ssl_session_cache shared:SSL_PORTAL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256;
    ssl_prefer_server_ciphers off;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Invoice attachments / Excel imports can be a few MB; bump from default 1m.
    client_max_body_size 50m;

    # ── /api/* → Express on portal-api:4000 ────────────────────────────────
    location /api/ {
        set $portal_api http://portal-api:4000;
        proxy_pass $portal_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_buffering off;
    }

    # ── / → Vite SPA on portal-web:80 ─────────────────────────────────────
    location / {
        set $portal_web http://portal-web:80;
        proxy_pass $portal_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
